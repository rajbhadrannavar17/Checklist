<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAPT Checklist — Web / API</title>
<style>
  :root{
    --bg: #FFFFFF;
    --panel: #FFFFFF;
    --panel-2: #FFFFFF;
    --border: #000000;
    --border-soft: #000000;
    --text: #000000;
    --muted: #000000;
    --muted-2: #000000;
    --amber: #000000;
    --amber-dim: #FFFFFF;
    --cyan: #000000;
    --green: #000000;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding: 32px 16px 80px;
  }
  .wrap{ max-width: 760px; margin: 0 auto; }

  /* header */
  .eyebrow{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted-2);
    text-transform: uppercase;
    margin: 0 0 6px;
  }
  h1{
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub{
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  .header-row{ margin-bottom:16px; }
  .frameworks{ display:flex; flex-wrap:wrap; gap:7px; margin: 12px 0 24px; }
  .frameworks a, .resource-links a{
    color:var(--cyan); text-decoration:none; border-bottom:1px solid transparent;
  }
  .frameworks a{
    font-family:var(--mono); font-size:10px; letter-spacing:.02em; border:1px solid var(--border);
    background:var(--panel); border-radius:999px; padding:5px 8px;
  }
  .frameworks a:hover, .resource-links a:hover{ border-color:var(--cyan); }

  /* toggle */
  .toggle{
    position: relative;
    display: flex;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .toggle button{
    position: relative;
    z-index: 2;
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 10px 12px;
    cursor: pointer;
    border-radius: 6px;
    transition: color 0.15s ease;
  }
  .toggle button.active{ color: var(--bg); }
  .toggle .thumb{
    position: absolute;
    top: 4px; bottom: 4px; left: 4px;
    width: calc(50% - 4px);
    background: var(--amber);
    border-radius: 6px;
    transition: transform 0.2s ease;
    z-index: 1;
  }
  .toggle .thumb.pos-1{ transform: translateX(100%); }

  /* progress */
  .progress-card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 24px;
  }
  .progress-top{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .progress-label{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  .progress-pct{
    font-family: var(--mono);
    font-size: 13px;
    color: var(--amber);
    font-weight: 700;
  }
  .bar-track{
    height: 6px;
    background: var(--border-soft);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill{
    height: 100%;
    background: var(--amber);
    border-radius: 3px;
    transition: width 0.25s ease;
    width: 0%;
  }
  .progress-counts{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted-2);
    margin-top: 8px;
  }

  /* actions */
  .actions{
    display:flex;
    justify-content: flex-end;
    margin-bottom: 16px;
  }
  .reset-btn{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  .reset-btn:hover{ border-color: var(--muted-2); color: var(--text); }

  /* categories */
  details.cat{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  details.cat[open] summary{ border-bottom: 1px solid var(--border); }
  summary.cat-head{
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    user-select: none;
  }
  summary.cat-head::-webkit-details-marker{ display:none; }
  .cat-num{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--amber);
    background: var(--amber-dim);
    background: var(--amber-dim);
    border-radius: 4px;
    padding: 2px 6px;
    min-width: 22px;
    text-align: center;
  }
  .cat-title{
    flex: 1;
    font-size: 14px;
    font-weight: 600;
  }
  .cat-count{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted-2);
  }
  .cat-chevron{
    color: var(--muted-2);
    font-size: 11px;
    transition: transform 0.15s ease;
  }
  details.cat[open] .cat-chevron{ transform: rotate(90deg); }

  .cat-body{ padding: 4px 8px 10px; }

  .item{
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .item:hover{ background: var(--panel-2); }

  .checkbox{
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    margin-top: 1px;
    border: 1.5px solid var(--muted-2);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s ease;
  }
  .checkbox.checked{
    background: var(--green);
    border-color: var(--green);
  }
  .checkbox svg{
    width: 12px; height: 12px;
    opacity: 0;
    transition: opacity 0.1s ease;
  }
  .checkbox.checked svg{ opacity: 1; }

  .item-text{
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
  }
  .resource-links{ display:flex; flex-wrap:wrap; gap:9px; margin-top:4px; font-family:var(--mono); font-size:10px; }
  .category-reference{ display:block; margin:8px 8px 4px; font-family:var(--mono); font-size:10px; color:var(--text); }
  .command-helper{ margin:12px 8px 4px; padding:12px; border:1px solid var(--border); border-radius:6px; }
  .command-helper-title{ font-size:12px; font-weight:700; margin:0 0 8px; }
  .command-controls{ display:flex; gap:8px; }
  .command-target{ min-width:0; flex:1; padding:7px 8px; border:1px solid var(--border); border-radius:4px; background:var(--panel); color:var(--text); font:12px var(--mono); }
  .command-btn{ padding:7px 9px; border:1px solid var(--border); border-radius:4px; background:var(--text); color:var(--bg); font:700 11px var(--mono); cursor:pointer; }
  .command-output{ display:none; white-space:pre-wrap; overflow-wrap:anywhere; margin:10px 0 0; font:11px/1.55 var(--mono); }
  .command-output.visible{ display:block; }
  .item.done .item-text{
    color: var(--muted-2);
    text-decoration: line-through;
    text-decoration-color: var(--muted-2);
  }
  .item.done .resource-links a{ color:var(--cyan); text-decoration:none; }

  @media (max-width: 480px){
    h1{ font-size: 18px; }
    .item-text{ font-size: 13px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header-row">
    <h1>Checklist</h1>
  </div>
  <nav class="frameworks" aria-label="Security testing frameworks">
    <a href="https://owasp.org/www-project-web-security-testing-guide/" target="_blank" rel="noopener noreferrer">OWASP WSTG</a>
    <a href="https://owasp.org/API-Security/editions/2023/en/0x11-t10/" target="_blank" rel="noopener noreferrer">OWASP API Top 10 (2023)</a>
    <a href="http://www.pentest-standard.org/index.php/Main_Page" target="_blank" rel="noopener noreferrer">PTES</a>
    <a href="https://attack.mitre.org/" target="_blank" rel="noopener noreferrer">MITRE ATT&amp;CK</a>
    <a href="https://cwe.mitre.org/" target="_blank" rel="noopener noreferrer">MITRE CWE</a>
    <a href="https://csrc.nist.gov/pubs/sp/800/115/final" target="_blank" rel="noopener noreferrer">NIST SP 800-115</a>
  </nav>

  <div class="toggle" id="toggle">
    <div class="thumb" id="thumb"></div>
    <button type="button" id="btn-web" class="active">WEB APP</button>
    <button type="button" id="btn-api">API</button>
  </div>

  <div class="progress-card">
    <div class="progress-top">
      <span class="progress-label" id="progress-label">WEB APP SCAN PROGRESS</span>
      <span class="progress-pct" id="progress-pct">0%</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="bar-fill"></div></div>
    <div class="progress-counts" id="progress-counts">0 / 0 checks complete</div>
  </div>

  <div class="actions">
    <button type="button" class="reset-btn" id="reset-btn">RESET CURRENT LIST</button>
  </div>

  <div id="categories"></div>

</div>

// Reference material is intentionally linked per checklist category so every
// test has a concise description plus an authorised-testing guide and tool tutorial.
const RESOURCES = {

  traversal: ['File-access test guide', ['Map download, attachment and export endpoints in Burp Suite.', 'Check normal and encoded path handling using only harmless test resources.', 'Verify access controls before and after canonicalisation.']],
  ssrf: ['SSRF test guide', ['Identify URL preview, webhook, import, callback and integration features.', 'Use a controlled collaborator/callback service approved for the engagement.', 'Check allowlists, redirects and cloud metadata protections.']],
  csrf: ['CSRF test guide', ['Capture a state-changing request in Burp Suite.', 'Review CSRF token, SameSite cookie and Origin/Referer handling.', 'Test only changes made to authorised test accounts.']],
  logic: ['Business-logic test guide', ['Create a workflow map for each sensitive action.', 'Use Burp Repeater or Turbo Intruder only within agreed rate limits.', 'Check step order, totals, state transitions, replay and concurrent actions.']],
  cors: ['CORS checks', ['curl -sI -H "Origin: https://example.invalid" {url}', 'curl -sI -H "Origin: null" {url}', 'Review Access-Control-Allow-Origin, credentials and Vary headers.']],
  http: ['HTTP-level checks', ['curl -s -D - -o /dev/null -X OPTIONS {url}', 'curl -sI {url}', 'Use Burp HTTP history to review method handling, forwarding headers and cache behaviour.']],
  errors: ['Error / disclosure checks', ['curl -s -i {url}', 'Review authorised error paths for stack traces, versions, internal paths and secrets.', 'Check source maps and verbose API responses without requesting sensitive production data.']],
  sensitive: ['Sensitive-data checks', ['curl -s {url}', 'Use browser DevTools Network and Storage panels to review authorised test traffic.', 'Check URLs, caches, JavaScript bundles and source maps for unintended sensitive data.']]
};

const API_PHASE_HELPERS = {
  recon: ['API inventory work-card', ['curl -sI {url}', 'nuclei -u {url} -tags api,exposure', 'Map documented, legacy, versioned and GraphQL endpoints; record method, authentication and role requirement.']],
  authtok: ['API authentication work-card', ['curl -sI {url}', 'Use Burp Suite to review API-key, JWT, OAuth2 and refresh-token handling with approved test accounts.', 'Verify expiry, revocation, scope and rotation behaviour.']],
  bola: ['BOLA work-card', ['Capture an authorised object request in Burp Repeater.', 'Compare ownership enforcement with two approved test accounts.', 'Record the object identifier, role, response code and response-body difference.']],
  bfla: ['Function-level authorization work-card', ['Map admin and privileged API functions from documentation and traffic.', 'Replay only authorised low-privilege test-account requests in Burp Repeater.', 'Verify method, endpoint and role checks happen server-side.']],
  data: ['Property-level authorization work-card', ['Inspect API responses for fields not required by the caller role.', 'Use an approved test request to review create/update field handling.', 'Confirm sensitive fields are filtered on reads and protected on writes.']],
  resource: ['Resource-consumption work-card', ['curl -sI {url}', 'Establish agreed request-rate and payload-size ceilings before testing.', 'Review pagination, batching, export and expensive queries within agreed limits.']],
  flows: ['Business-flow API work-card', ['Build an expected state-transition map from the documented flow.', 'Use Burp Repeater to validate permitted transitions with approved test accounts.', 'Check automation resistance, one-time-use conditions and usage limits.']],
  ssrf: ['Third-party / SSRF API work-card', ['Identify callback, import and URL-consuming parameters.', 'Use an approved controlled callback endpoint for validation.', 'Review allowlists, response validation and metadata-service restrictions.']],
  misconfig: ['API configuration work-card', ['curl -sI {url}', 'nuclei -u {url} -tags misconfig,headers,tls', 'Review CORS, TLS, errors, default settings and management endpoints.']],
  graphql: ['GraphQL work-card', ['Identify the GraphQL endpoint from authorised documentation or traffic.', 'Review introspection, resolver authorization, query depth, aliases and batching within agreed limits.', 'Record limits and error-handling behaviour.']]
};

function commandFor(helper, target, phase){
  const raw = target.trim();
  if (!raw) return '';
  let url = raw;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  let host;
  try { host = new URL(url).hostname; } catch(e) { return 'Enter a valid authorised URL or IP address.'; }
  const actions = helper[1].map((line, index) => (index + 1) + '. ' + line.replaceAll('{url}', url).replaceAll('{host}', host).replaceAll('{target}', raw)).join('\n\n');
  return 'VAPT WORK-CARD\n' +
    'Phase: ' + phase + '\n' +
    'Target: ' + url + ' (host: ' + host + ')\n\n' +
    'Objective\nValidate the controls relevant to this phase against the authorised target, while preserving service availability and collecting reproducible evidence.\n\n' +
    'Execution plan\n' + actions + '\n\n' +
    'Evidence to capture\n• Exact request/command and UTC timestamp\n• Sanitised request/response, status code, headers and relevant screenshots\n• Test-account role, affected object/endpoint and observed versus expected result\n\n' +
    'Validation standard\nConfirm findings with a repeatable, low-impact test. Record scope, preconditions, business impact, remediation guidance and retest result. Do not test beyond written authorisation or agreed rate limits.';
}

// Ordered to follow the supplied engagement flow. Sources appear once only,
// at category level, rather than being repeated for every check.
DATA.web = [
  {id:'scope',title:'1. Pre-engagement & scope',items:['Confirm written authorisation and testing window','Record in-scope and out-of-scope assets','Obtain role-based test accounts and identify authentication','Confirm environments, permitted techniques, rate/DoS limits and tester IP','Define evidence collection and reporting requirements']},
  {id:'recon',title:'2. Reconnaissance & attack-surface discovery',items:['Identify domains, subdomains, technologies and exposed documentation','Review JavaScript, API references, robots.txt, sitemap.xml and security.txt','Search for exposed endpoints, cloud storage and accidentally published files','Enumerate authorised hosts, HTTP services, virtual hosts, directories and files','Identify backups, configuration files, administrative and debug interfaces']},
  {id:'tls',title:'3. TLS / HTTPS',items:['Enforce HTTPS and redirects; validate certificate and hostname','Disable weak TLS versions and cipher suites','Configure HSTS and secure cookie attributes','Ensure sensitive information never transits over HTTP']},
  {id:'headers',title:'4. Security headers & caching',items:['Review CSP, HSTS, X-Content-Type-Options, Referrer-Policy and Permissions-Policy','Review X-Frame-Options or CSP frame-ancestors','Test CSP directives for unsafe values and broad wildcards','Ensure sensitive responses are not cached by browsers or proxies']},
  {id:'auth',title:'5. Authentication & session management',items:['Test enumeration, password policy, spraying resistance, brute-force controls and lockout','Review default credentials, authentication errors, reset and password-change flows','Assess session ID randomness, fixation, expiry, logout and concurrent sessions','Verify Secure, HttpOnly and appropriate SameSite cookies','Ensure session tokens are absent from URLs and Referer headers']},
  {id:'authz',title:'6. Authorization / access control',items:['Test each sensitive function with distinct roles','Verify horizontal and vertical access controls server-side','Test IDOR/BOLA, missing authorization and privilege escalation','Test forced browsing, parameter manipulation and HTTP method manipulation']},
  {id:'input',title:'7. Input validation',items:['Cover query, POST, JSON, headers, cookies, paths, files and HTTP methods','Test XSS, SQL/NoSQL, LDAP, XML, template, command and expression injection','Test CRLF injection and HTTP parameter pollution']},
  {id:'xss',title:'8. XSS testing',items:['Identify reflected parameters and output contexts','Test encoding and filtering in HTML, attribute, JavaScript and URL contexts','Test stored-XSS inputs: profiles, comments, messages, uploads and admin tools','Review DOM sources/sinks including innerHTML, document.write, eval, location and postMessage']},
  {id:'injection',title:'9. Injection testing',items:['Test SQL injection in login, search, IDs, filters, headers, cookies and JSON','Check error, boolean, time and UNION behaviours where appropriate','Test NoSQL operators and authentication/search queries','Review file processing, utilities, imports/exports and media handling for command injection']},
  {id:'upload',title:'10. File upload',items:['Validate extension, MIME type, content, filename and file size','Test traversal, double extensions, execution, SVG/HTML uploads and server processing','Review storage controls and malware scanning where applicable']},
  {id:'traversal',title:'11. Path traversal & file inclusion',items:['Test local/remote inclusion where relevant, traversal encodings and alternate paths','Assess file download and export functionality']},
  {id:'ssrf',title:'12. SSRF',items:['Identify URL preview, webhooks, import, PDF generation, integration and callback features','Test internal network and cloud-metadata exposure','Review redirect handling, DNS-rebinding protections and allowlist validation']},
  {id:'csrf',title:'13. CSRF',items:['Verify CSRF tokens are required, session-bound and server validated','Review SameSite and Origin/Referer checks; ensure GET is not state-changing','Test account, transaction and administrative changes']},
  {id:'logic',title:'14. Business logic',items:['Test workflow bypass, step skipping, price/quantity manipulation and coupon abuse','Test race conditions, duplicate transactions, replay and unauthorized state changes','Test recovery, verification, approvals, limits and multi-account abuse']},
  {id:'cors',title:'15. CORS',items:['Identify policy and test arbitrary/null origins','Test credentialed cross-origin requests and wildcard configuration','Verify sensitive endpoints remain protected']},
  {id:'http',title:'16. HTTP-level testing',items:['Test HTTP methods, OPTIONS, TRACE and request-smuggling indicators','Test Host and forwarding headers, cache poisoning/deception and parameter pollution','Test request desynchronization']},
  {id:'errors',title:'17. Error handling & information disclosure',items:['Check stack traces, debug messages, versions, database errors and internal paths','Check source/configuration disclosure, response secrets, sensitive logs and excessive API errors']},
  {id:'sensitive',title:'18. Sensitive data exposure',items:['Ensure passwords, tokens and API keys are not exposed unnecessarily','Minimise PII and encrypt sensitive data in transit','Keep sensitive data out of URLs, caches, client-side JavaScript and source maps']}
];

// build stable ids
for (const list of ['web','api']){
  DATA[list].forEach(cat => {
    cat.items = cat.items.map((text,i) => ({ id: list+'-'+cat.id+'-'+i, text }));
  });
}

let current = 'web';
let state = { web:{}, api:{} };

const checkIcon = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4.5" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function totalsFor(list){
  const cats = DATA[list];
  let total = 0, checked = 0;
  cats.forEach(cat => {
    cat.items.forEach(it => {
      total++;
      if (state[list][it.id]) checked++;
    });
  });
  return { total, checked };
}

function render(){
  const cats = DATA[current];
  const shownSources = new Set();
  const container = document.getElementById('categories');
  container.innerHTML = '';

  cats.forEach((cat, idx) => {
    const catTotal = cat.items.length;
    const catChecked = cat.items.filter(it => state[current][it.id]).length;

    const details = document.createElement('details');
    details.className = 'cat';
    details.open = true;

    const summary = document.createElement('summary');
    summary.className = 'cat-head';
    summary.innerHTML =
      '<span class="cat-num">' + String(idx).padStart(2,'0') + '</span>' +
      '<span class="cat-title">' + cat.title + '</span>' +
      '<span class="cat-count">' + catChecked + '/' + catTotal + '</span>' +
      '<span class="cat-chevron">&#9656;</span>';
    details.appendChild(summary);

    const body = document.createElement('div');
    body.className = 'cat-body';
    const refs = RESOURCES[current][cat.id];
    if (refs && !shownSources.has(refs[1])) {
      shownSources.add(refs[1]);
      const reference = document.createElement('a');
      reference.className = 'category-reference';
      reference.href = refs[1]; reference.target = '_blank'; reference.rel = 'noopener noreferrer';
      reference.textContent = '↗ Reference: ' + refs[0];
      body.appendChild(reference);
    }

    cat.items.forEach(it => {
      const isChecked = !!state[current][it.id];
      const row = document.createElement('div');
      row.className = 'item' + (isChecked ? ' done' : '');

      const box = document.createElement('div');
      box.className = 'checkbox' + (isChecked ? ' checked' : '');
      box.innerHTML = checkIcon;

      const label = document.createElement('div');
      label.className = 'item-text';
      label.textContent = it.text;

      row.appendChild(box);
      row.appendChild(label);

      row.addEventListener('click', () => toggleItem(it.id));

      body.appendChild(row);
    });

    const helper = (current === 'web' ? PHASE_HELPERS : API_PHASE_HELPERS)[cat.id];
    if (helper) {
      const panel = document.createElement('section');
      panel.className = 'command-helper';
      panel.innerHTML = '<p class="command-helper-title">' + helper[0] + '</p>' +
        '<div class="command-controls"><input class="command-target" aria-label="Authorised target URL or IP" placeholder="Authorised target URL or IP">' +
        '<button type="button" class="command-btn">GENERATE</button></div>' +
        '<pre class="command-output"></pre>';
      const input = panel.querySelector('.command-target');
      const output = panel.querySelector('.command-output');
      panel.querySelector('.command-btn').addEventListener('click', () => {
        output.textContent = commandFor(helper, input.value, cat.title);
        output.classList.toggle('visible', !!output.textContent);
      });
      input.addEventListener('keydown', event => { if (event.key === 'Enter') panel.querySelector('.command-btn').click(); });
      body.appendChild(panel);
    }

    details.appendChild(body);
    container.appendChild(details);
  });

  updateProgress();
}

function toggleItem(id){
  state[current][id] = !state[current][id];
  saveState();
  render();
}

function updateProgress(){
  const { total, checked } = totalsFor(current);
  const pct = total === 0 ? 0 : Math.round((checked/total)*100);
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('bar-fill').style.width = pct + '%';
  document.getElementById('progress-counts').textContent = checked + ' / ' + total + ' checks complete';
  document.getElementById('progress-label').textContent =
    (current === 'web' ? 'WEB APP' : 'API') + ' SCAN PROGRESS';
}

function setTab(tab){
  current = tab;
  document.getElementById('btn-web').classList.toggle('active', tab === 'web');
  document.getElementById('btn-api').classList.toggle('active', tab === 'api');
  document.getElementById('thumb').classList.toggle('pos-1', tab === 'api');
  render();
}

document.getElementById('btn-web').addEventListener('click', () => setTab('web'));
document.getElementById('btn-api').addEventListener('click', () => setTab('api'));

document.getElementById('reset-btn').addEventListener('click', () => {
  state[current] = {};
  saveState();
  render();
});

function saveState(){
  try{
    if (typeof window.storage !== 'undefined'){
      window.storage.set('vapt-checklist-state', JSON.stringify(state)).catch(()=>{});
    }
  }catch(e){}
}

function loadState(){
  try{
    if (typeof window.storage !== 'undefined'){
      window.storage.get('vapt-checklist-state').then(res => {
        if (res && res.value){
          try{
            const parsed = JSON.parse(res.value);
            if (parsed && parsed.web && parsed.api){
              state = parsed;
              render();
            }
          }catch(e){}
        }
      }).catch(()=>{});
    }
  }catch(e){}
}

loadState();
render();
</script>
</body>
</html>
